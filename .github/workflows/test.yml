name: Test action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      # The action runs from the committed bundle, so it must match the current src/.
      - name: Verify dist/index.js is up to date with src/
        run: |
          if [ -n "$(git status --porcelain dist/index.js)" ]; then
            echo "::error::dist/index.js is out of date — run 'npm run build' and commit the result."
            git --no-pager diff dist/index.js
            exit 1
          fi
