name: 'DevPliance Upload'
description: 'Upload .devpliance compliance evidence to DevPliance from CI/CD'
author: 'DevPliance'

inputs:
  api-url:
    description: 'DevPliance API base URL for your instance, e.g. https://acme.devpliance.com'
    required: true
  api-key:
    description: 'Repository API key from the DevPliance dashboard (dp_key_...)'
    required: true
  evidence-dir:
    description: 'Path to the .devpliance evidence directory'
    required: false
    default: '.devpliance'

outputs:
  controls:
    description: 'Comma-separated control ids captured from the upload'
  controls-parsed:
    description: 'Number of controls captured'

runs:
  using: 'node20'
  main: 'dist/index.js'

branding:
  icon: 'upload-cloud'
  color: 'purple'
